version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agepe_postgres
    restart: always
    environment:
      POSTGRES_USER: agepe_user
      POSTGRES_PASSWORD: agepe_password
      POSTGRES_DB: agepe_pesquisa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agepe_user -d agepe_pesquisa"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: agepe_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agepe_backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - DATABASE_URL=postgresql://agepe_user:agepe_password@postgres:5432/agepe_pesquisa?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=agepe_jwt_secret_super_secure_key_2026
      - JWT_REFRESH_SECRET=agepe_jwt_refresh_secret_super_secure_key_2026
      - APP_URL=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agepe_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
